<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>智能问答 · Internal RAG</title>
    <meta
      name="description"
      content="多阶段检索问答：复杂问题自动规划、多路召回、覆盖优先、证据约束生成"
    />
    <link rel="stylesheet" href="/assets/chat.css?v=20260812-1" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/chat" aria-label="智能问答首页">
        <span class="brand-mark">IR</span>
        <span>
          <strong>Internal RAG</strong>
          <small>网关 · 检索与问答</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a class="nav-tab" href="/ingestion">资料接入台</a>
        <a class="nav-tab active" href="/chat" aria-current="page">智能问答</a>
      </nav>
      <div class="topbar-actions">
        <span class="service-pill" id="servicePill" aria-live="polite">正在检查服务…</span>
      </div>
    </header>

    <main class="shell">
      <div class="composer-card">
        <div class="kb-row">
          <label class="field">
            <span class="field-label">知识库</span>
            <select id="kbSelect" class="kb-select" aria-label="选择知识库">
              <option value="">加载中…</option>
            </select>
          </label>
          <span class="kb-hint" id="kbHint"></span>
        </div>
        <div class="input-row">
          <textarea
            id="questionInput"
            class="question-input"
            rows="3"
            placeholder="输入问题，例如：对比植被多光谱遥感无人机、普通可见光巡检无人机，在成像波段、作业最佳时段、精度评价指标上有什么不同？"
            aria-label="问题输入"
          ></textarea>
          <button class="primary-button" id="sendButton" type="button" disabled>
            <span id="sendLabel">提问</span>
          </button>
        </div>
        <p class="form-message" id="formMessage" role="status"></p>
        <div class="suggestion-row" aria-label="示例问题">
          <span class="suggestion-label">试试：</span>
          <button class="suggestion" type="button" data-q="对比植被多光谱遥感无人机、普通可见光巡检无人机，在成像波段、作业最佳时段、精度评价指标上有什么不同？">多光谱 vs 可见光</button>
          <button class="suggestion" type="button" data-q="变电站巡检无人机的定义是什么？">变电站巡检无人机定义</button>
          <button class="suggestion" type="button" data-q="野大豆空间分布无人机遥感监测的拍摄时间要求？">野大豆监测拍摄时间</button>
        </div>
      </div>

      <section class="answer-area" id="answerArea" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-mark" aria-hidden="true">?</div>
          <p>输入问题开始问答。复杂对比/流程/总结类问题会走多阶段检索，并展示覆盖矩阵与证据引用。</p>
        </div>

        <article class="answer-card" id="answerCard" hidden>
          <div class="answer-head">
            <h2 class="answer-title">回答</h2>
            <span class="status-badge" id="statusBadge"></span>
            <span class="answer-meta" id="answerMeta"></span>
          </div>
          <div class="answer-body" id="answerBody"></div>
          <div class="answer-claims" id="claimsBlock" hidden>
            <h3 class="sub-title">结论要点</h3>
            <ul class="claims-list" id="claimsList"></ul>
          </div>
          <div class="coverage-block" id="coverageBlock" hidden>
            <h3 class="sub-title">覆盖矩阵</h3>
            <div class="coverage-grid" id="coverageGrid"></div>
          </div>
          <div class="missing-block" id="missingBlock" hidden>
            <h3 class="sub-title">资料缺失</h3>
            <ul class="missing-list" id="missingList"></ul>
          </div>
          <div class="citations-block" id="citationsBlock" hidden>
            <h3 class="sub-title">引用证据</h3>
            <ol class="citations-list" id="citationsList"></ol>
          </div>
          <div class="answer-foot">
            <span id="promptVersion"></span>
            <span id="requestId"></span>
          </div>
        </article>
      </section>
    </main>

    <script src="/assets/chat.js?v=20260812-1"></script>
  </body>
</html>
