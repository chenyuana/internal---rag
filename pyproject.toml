[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-rag-gateway"
version = "0.1.0"
description = "Evidence-grounded RAG gateway for internal technical documents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pdfplumber>=0.11,<1",
    "Pillow>=12,<13",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6.0,<7",
    "PyYAML>=6.0.2,<7",
    "redis>=5.2,<7",
    "SQLAlchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0.12,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=D:/internal-rag/temp/pytest"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party evaluation stack without type stubs (ragas/langchain/datasets).
module = [
    "ragas.*",
    "datasets.*",
    "langchain_ollama.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_community.*",
    "langchain_text_splitters.*",
    "ollama.*",
    "openai.*",
    "tiktoken.*",
    "langsmith.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy 2.5 stubs use Python 3.12 `type` statements; mypy targets 3.11 here.
module = ["numpy.*"]
ignore_errors = true
